dwindle {
    force_split = 0
    permanent_direction_override = false
    preserve_split = true
    pseudotile = true
    smart_resizing = true
    smart_split = false
}

windowrule = workspace 3,    class:^Spotify$
windowrule = workspace 3,    class:^discord$
windowrule = noinitialfocus, class:^Spotify$
windowrule = noinitialfocus, class:^discord$

# for whatever reason that tool flashes a window... so move it out of the way
windowrule = float, class:^multi_export_cli.py$
windowrule = move 1000000 1000000, class:^multi_export_cli.py$
